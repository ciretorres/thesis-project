    // Métodos de acciones para elementos de la interfaz

    // Eventos del teclado
    document.addEventListener('keydown', function (event) {
      // Interacción
      if (event.key === "Escape") {
        console.log("Escape key pressed");
        // cierra tarjeta informativa
        if (document.querySelector("#tarjetainfoid").style.display === "block") {
          document.querySelector("#tarjetainfoid")
            .style.display = "none";
        }
        // cierra modal informativo
        if (document.querySelector("#dialogid").style.display === "block") {
          document.querySelector("#dialogid")
            .style.display = "none";
        }
      }
    });


  </script>
