    import { exportCamera } from './script.js'
    import { starsCatalogue } from './components/models/estrellas'
    // módulo para rotar y zoom en la escena
    import { increasePositionZ, decreasePositionZ, resetPosition } from './utils/zoom.js'
    import { imprime } from './scripts/imprimir.js'
    imprime();
    window.imprime = imprime;

    window.increasePositionZ = increasePositionZ;
    window.decreasePositionZ = decreasePositionZ;
    window.resetPosition = resetPosition;
    window.exportCamera = exportCamera;
    window.starsCatalogue = starsCatalogue;


    // Métodos de acciones para elementos de la interfaz
    function btnIncrementaPosZ() {
      increasePositionZ(exportCamera())
    }
    window.btnIncrementaPosZ = btnIncrementaPosZ;

    function btnDecrementaPosZ() {
      decreasePositionZ(exportCamera())
    }
    window.btnDecrementaPosZ = btnDecrementaPosZ;

    // Eventos del teclado
    document.addEventListener('keydown', function (event) {
      if (event.key === '+') {
        console.log('+ key pressed');
        const star = starsCatalogue.children.find(star => star.id === 22)
        console.log(star.position)
        star.position.z += 1;
        console.log(star.position)
      }
      if (event.key === '-') {
        console.log('+ key pressed');
        const star = starsCatalogue.children.find(star => star.id === 22)
        console.log(star.position)
        star.position.z -= 1;
        console.log(star.position)
      }
      if (event.key === 'w') {
        console.log('W key pressed');
        increasePositionZ(exportCamera())
      }
      if (event.key === 's') {
        console.log('S key pressed');
        decreasePositionZ(exportCamera())
      }
      if (event.key === 'Enter') {
        console.log('Enter key pressed');
        resetPosition(exportCamera())
      }

      if (event.key === "a") {
        console.log("A key pressed");
        exportCamera().position.x -= 5;
      }
      if (event.key === "d") {
        console.log("D key pressed");
        exportCamera().position.x += 5;

      }
      if (event.key === "q") {
        console.log("Q key pressed");
        exportCamera().position.y -= 5;
      }
      if (event.key === "e") {
        console.log("E key pressed");
        exportCamera().position.y += 5;
      }
    });
