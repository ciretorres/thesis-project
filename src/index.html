    function toogleControles() {
      const controlesid = document.querySelector("#controlesid")
      const botontogglecontrolesid = document.querySelector("#botontogglecontrolesid")
      if (toogle) {
        // controlesid.style.visibility = "hidden";
        controlesid.style.display = "none";

      } else {

        toogle = true;
      }
    }
    window.toogleControles = toogleControles;

    function btnIncrementaPosZ() {
      increasePositionZ(exportCamera())

    function btnDecrementaPosZ() {
      decreasePositionZ(exportCamera())
    }
    window.btnDecrementaPosZ = btnDecrementaPosZ;

    // Eventos del teclado
    document.addEventListener('keydown', function (event) {
      if (event.key === 'w') {
        console.log('W key pressed');
        increasePositionZ(exportCamera())
      }
      if (event.key === 's') {
        console.log('S key pressed');
        decreasePositionZ(exportCamera())
      }
      if (event.key === 'Enter') {
        console.log('Enter key pressed');
        resetPosition(exportCamera())
      }

      if (event.key === "a") {
        console.log("A key pressed");
        exportCamera().position.x -= 5;
      }
      if (event.key === "d") {
        console.log("D key pressed");
        exportCamera().position.x += 5;

      }
      if (event.key === "q") {
        console.log("Q key pressed");
        exportCamera().position.y -= 5;
      }
      if (event.key === "e") {
        console.log("E key pressed");
        exportCamera().position.y += 5;
      }
    });
